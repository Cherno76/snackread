[package]
name = "cshow-gui"
version = "0.4.94"
description = "cshow 的 GUI 版：条漫丝滑度实验"
edition = "2021"

[lib]
name = "cshow_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.9", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi",
] }
env_logger = "0.11"
log = "0.4"
zip = "2"
roxmltree = "0.20"
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
regex = "1"
base64 = "0.22"
zhconv = "0.4.1"

[dev-dependencies]
sha2 = "0.10"

# 依赖库只保留行号级调试信息，大幅减小构建产物体积（应用自身仍是完整调试信息）
[profile.dev.package."*"]
debug = "line-tables-only"
